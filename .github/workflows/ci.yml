name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          hakiki keygen --out ci
          python "$GITHUB_WORKSPACE/examples/quickstart.py"
          python "$GITHUB_WORKSPACE/examples/tamper_demo.py"
